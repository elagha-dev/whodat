=====================================================================
 WHO DAT  -  Developer notes (for later use / extension)
=====================================================================

WHAT IT IS
  A party game for 2-10 players. Everyone writes 2-3 secret facts, then
  each turn one player sees another player's facts and guesses who wrote
  them. Single file (index.html), no build step. Works in two modes:
    1. One phone  : pass the phone around. No internet needed.
    2. Live       : every player on their own phone, synced by Firebase.

HOSTING
  Upload index.html to a public GitHub repo, then Settings > Pages >
  Branch: main > Save. Any static host works (Netlify, Firebase Hosting).

FIREBASE SETUP (one time)
  1. console.firebase.google.com > create project > add Web app (</>).
  2. Menu > Databases & Storage > Realtime Database > Create Database
     (location: United States) > Rules tab > paste:
       { "rules": { "games": { "$code": { ".read": true, ".write": true } } } }
     > Publish.
  3. Put your config in the FBC variable at the top of the <script>.
     If you use another database region, set databaseURL to the address
     shown at the top of the Realtime Database page.
  The config is not secret. The rules above let anyone read/write the
  "games" data; tighten them if you ever store anything sensitive.

HOW LIVE MODE WORKS
  Data lives at  games/<CODE>/players/<playerId>  (one record per phone).
  Each phone writes only its own record ("presence"):
    Everyone : n = name, f = facts [..], g = guess {t, r, v}
    Host only: h = 1, ph = phase (lobby|facts|play|end), min, ord = turn
               order, t = turn index, rv = 1 when result is shown,
               lg = last guess, sc = scores {name: points}, r = round id,
               end = lobby countdown end (server time, ms)
  The HOST phone is the referee. All phones just render what they see.
  Card for turn t: guesser = ord[t], facts owner = ord[(t+1) % n]
  (a rotation, so nobody ever gets their own card).
  Disconnected phones are removed automatically (onDisconnect).
  The invite link is your page address plus the game code (#g=CODE). The
  Firebase config is already inside this file, so friends need no setup.

MAIN PARTS OF THE CODE  (search for these names)
  FBC, fbInit, mkRoom : Firebase connection and the small "room" wrapper
  V.mode / V.rules / V.setup / V.facts / V.play / V.end : one-phone screens
  V.lv, lvGame        : live-mode screens (lobby, facts, play, end)
  lvOpen, onP, tick   : join/create game, react to changes, host scoring
  lvStart             : host starts or restarts a game (shuffles order)
  hdr / wzb / isSetup : top bar; setup screens (mode, lobby, facts) show as a
                        popup wizard, play/end are flat full-screen
  CSS variables in :root : colors and dark mode

EASY CHANGES
  Colors / fonts      : edit the :root variables and the Fredoka font link.
  Player limits       : minimum is chosen in the app; max 10 is checked in
                        lvGame (names.length>10) and setup (players.length>=10).
  Facts per player    : the three inputs f0,f1,f2 (min 2 checked in 'sf'
                        and 'save'); add f3 by extending those arrays.
  Game types          : gm = 'facts' | 'q' (host record), qt = 'who'|'ans' (how to guess), qs = the chosen
                        questions, QB = question bank, QN = questions each.
  Scoring             : in tick() (live) and the guess handler in bind()
                        (one phone). Currently +1 per correct guess.
  Reveal time        : 3500 ms in clock() (auto-advance after a guess).

IDEAS TO EXTEND
  - Several guesses per card, or points that shrink with each wrong guess.
  - Kick/rename players, or a timer per turn.
  - Save past scores (add a "history" path in Firebase).
  - Sound or haptics on a correct guess (navigator.vibrate).
  - Lock rules down with Firebase Anonymous Auth.

TROUBLESHOOTING
  "Firebase is not set up yet"   : FBC is missing or has no apiKey.
  Stuck on "Connecting"          : wrong databaseURL, database not created,
                                   or rules not published.
  Names with . # $ [ ] /         : removed on purpose (not allowed by Firebase).
  Changes not showing after upload: wait ~1 min and reopen the tab.
=====================================================================
-->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#1a1a1a;--mute:#777;--acc:#ff5a5f;--soft:#ebebe6;--line:#1a1a1a;--shadow:#1a1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#202020;--ink:#f2f2f0;--mute:#9a9a9a;--line:#f2f2f0;--soft:#2c2c2c;--shadow:#000}}
:root[data-theme="dark"]{--bg:#141414;--card:#202020;--ink:#f2f2f0;--mute:#9a9a9a;--line:#f2f2f0;--soft:#2c2c2c;--shadow:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}*::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.35 Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 18px 48px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:14px}.top>:last-child{justify-self:end;margin:-8px -8px 0 0}.logo{display:block;height:64px;width:auto;grid-column:2}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:drop-shadow(0 0 1px #fff)}}:root[data-theme="dark"] .logo{filter:drop-shadow(0 0 1px #fff)}

.wz{display:flex;justify-content:space-between;position:relative;margin:4px 0 20px}
.wz:before{content:"";position:absolute;left:16.6%;right:16.6%;top:15px;height:4px;background:var(--soft);border-radius:4px}
.wz div{position:relative;flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.wz b{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;background:var(--soft);border:3px solid var(--line);color:var(--ink);font-size:15px}
.wz .on b{background:var(--acc);color:#fff}.wz .on{color:var(--ink)}.wz .done b{background:var(--ink);color:var(--bg)}
.hbt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.hbt .alt{width:100%;min-width:0;padding:12px 8px;font-size:15px;white-space:nowrap}
.nav{display:flex;gap:10px}.nav .alt{width:auto;flex:none;padding:14px 20px;white-space:nowrap}
.opt small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}.code{letter-spacing:10px;font-size:52px;font-weight:700;text-align:center;color:var(--ink)}
.big{font-size:84px;font-weight:700;line-height:1;text-align:center}
.stp{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0}
.stp button{width:64px;height:64px;padding:0;font-size:32px;flex:none}
h1{font-size:34px;line-height:1.05;margin:6px 0 12px;font-weight:700}
h2{font-size:28px;line-height:1.1;margin:6px 0 12px;font-weight:700}
.how{display:flex;gap:12px;align-items:center;background:var(--soft);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:4px 4px 0 var(--shadow);margin:6px 0 18px;font-weight:600}
.how .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.panel{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:5px 5px 0 var(--shadow);margin-bottom:18px}
input,textarea{width:100%;padding:14px 16px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:5px 0;outline:0}
input:focus,textarea:focus{border-color:var(--acc)}
button{font:inherit;font-weight:700;font-size:18px;color:var(--bg);background:var(--ink);border:3px solid var(--line);border-radius:16px;padding:14px 18px;width:100%;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow);background:var(--acc);color:#fff}
button.pr:not(.hs):not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow);background:var(--acc);color:#fff}
button:disabled{opacity:.45;box-shadow:none}
button.alt{background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px}.row input{flex:1;margin:0}.row button{width:auto;padding:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:5px 12px 5px 5px;font-weight:600}
.chip{border:2px solid transparent}
.chip.done{font-weight:700;color:#0a7a4b;background:linear-gradient(#e6f8ee,#e6f8ee) padding-box,linear-gradient(110deg,#b8860b,#ffd700,#fff7b8,#ffd700,#b8860b) border-box;background-size:100% 100%,250% 100%;animation:shine 2s linear infinite alternate;box-shadow:0 0 10px rgba(255,200,0,.55)}
.chip[data-pf]{cursor:pointer}
.chip[data-pf].sel{border-color:var(--ink);background:var(--card);box-shadow:2px 2px 0 var(--shadow)}.chip[data-pf].sel::before{content:'✓';font-weight:800;color:#12a36a;margin:0 -2px 0 4px}
.avs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:max-content;gap:6px;overflow-x:auto;padding:2px 2px 8px}
.av img,.ae img{display:block;width:100%;height:100%;object-fit:cover}.ae img{width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}.ae.up svg{border-style:dashed;background:var(--soft);padding:9px;box-sizing:border-box;color:var(--ink)}.dlg .av{width:76px;height:76px;margin:0 auto 12px;font-size:36px}

button.ae{width:auto;flex:none;font-size:24px;line-height:1;padding:3px;box-shadow:none;border:0;background:transparent;border-radius:50%}.ae svg{display:block;width:42px;height:42px;border-radius:50%;border:2px solid var(--line)}
button.ae.on{box-shadow:0 0 0 3px #ffb800}button.ae:active:not(:disabled),button.ae.pr:not(:disabled){background:transparent;transform:none;box-shadow:none}button.ae.on:active:not(:disabled){box-shadow:0 0 0 3px #ffb800}
.chip .st{width:9px;height:9px;border-radius:50%;background:#12a36a;flex:none;margin-left:2px}.chip.away{opacity:.6}.chip.away .st{background:var(--mute)}
.devb{display:none}
html.wlow::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:62;border:4px solid #e03131;animation:wl .5s ease-in-out infinite alternate}
@keyframes wl{from{box-shadow:inset 0 0 0 0 rgba(224,49,49,0);opacity:.55}to{box-shadow:inset 0 0 40px 12px rgba(224,49,49,.7);opacity:1}}
@media(prefers-reduced-motion:reduce){html.wlow::before{animation:none}}
body.dev:not(:has(.wsheet))::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:60;border:4px solid #1c7ed6;animation:devp 1.6s ease-in-out infinite}
@keyframes devp{0%,100%{box-shadow:inset 0 0 0 0 rgba(28,126,214,0);opacity:.4}50%{box-shadow:inset 0 0 36px 10px rgba(28,126,214,.65);opacity:1}}

/* ===== PLAYER PROFILES (local, no passwords) =====
   Everything that depends on WHO is playing goes through two small objects:
   Auth = identity (list / create / signIn / signOut / current)
   PS   = that player's private storage (get / set), namespaced by player id

   (profile.id becomes the user id) and point PS at that user's saved record.
   Nothing else in the app knows where profiles live. */
var PKEYS=['wdxp','wdqd','wdqbest','wdqlbest','wdqsbest','wdqmbest','wdqmghost','wdqseen','wdmq','wdth'];

function list(){return rd().sort(function(a,b){return(b.last||0)-(a.last||0)})}
function get(id){return rd().filter(function(p){return p.id==id})[0]||null}

if(!name)return{err:'Type a username first.'};if(name.length>14)return{err:'Usernames can be up to 14 characters.'};

var p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name,av:av||AVIDS[0]||'',created:Date.now(),last:Date.now()};
l.push(p);if(!wr(l))return{err:'Could not save the profile. Storage may be full or blocked.'};
