<!DOCTYPE html>
<!--
=====================================================================
 WHO DAT  -  Developer notes (for later use / extension)
=====================================================================

WHAT IT IS
  A party game for 2-10 players. Everyone writes 2-3 secret facts, then
  each turn one player sees another player's facts and guesses who wrote
  them. Single file (index.html), no build step. Works in two modes:
    1. One phone  : pass the phone around. No internet needed.
    2. Live       : every player on their own phone, synced by Firebase.

HOSTING
  Upload index.html to a public GitHub repo, then Settings > Pages >
  Branch: main > Save. Any static host works (Netlify, Firebase Hosting).

FIREBASE SETUP (one time)
  1. console.firebase.google.com > create project > add Web app (</>).
  2. Menu > Databases & Storage > Realtime Database > Create Database
     (location: United States) > Rules tab > paste:
       { "rules": { "games": { "$code": { ".read": true, ".write": true } } } }
     > Publish.
  3. Put your config in the FBC variable at the top of the <script>.
     If you use another database region, set databaseURL to the address
     shown at the top of the Realtime Database page.
  The config is not secret. The rules above let anyone read/write the
  "games" data; tighten them if you ever store anything sensitive.

HOW LIVE MODE WORKS
  Data lives at  games/<CODE>/players/<playerId>  (one record per phone).
  Each phone writes only its own record ("presence"):
    Everyone : n = name, f = facts [..], g = guess {t, r, v}
    Host only: h = 1, ph = phase (lobby|facts|play|end), min, ord = turn
               order, t = turn index, rv = 1 when result is shown,
               lg = last guess, sc = scores {name: points}, r = round id,
               end = lobby countdown end (server time, ms)
  The HOST phone is the referee. All phones just render what they see.
  Card for turn t: guesser = ord[t], facts owner = ord[(t+1) % n]
  (a rotation, so nobody ever gets their own card).
  Disconnected phones are removed automatically (onDisconnect).
  The invite link is your page address plus the game code (#g=CODE). The
  Firebase config is already inside this file, so friends need no setup.

MAIN PARTS OF THE CODE  (search for these names)
  FBC, fbInit, mkRoom : Firebase connection and the small "room" wrapper
  V.mode / V.rules / V.setup / V.facts / V.play / V.end : one-phone screens
  V.lv, lvGame        : live-mode screens (lobby, facts, play, end)
  lvOpen, onP, tick   : join/create game, react to changes, host scoring
  lvStart             : host starts or restarts a game (shuffles order)
  hdr / wzb / isSetup : top bar; setup screens (mode, lobby, facts) show as a
                        popup wizard, play/end are flat full-screen
  CSS variables in :root : colors and dark mode

EASY CHANGES
  Colors / fonts      : edit the :root variables and the Fredoka font link.
  Player limits       : minimum is chosen in the app; max 10 is checked in
                        lvGame (names.length>10) and setup (players.length>=10).
  Facts per player    : the three inputs f0,f1,f2 (min 2 checked in 'sf'
                        and 'save'); add f3 by extending those arrays.
  Game types          : gm = 'facts' | 'q' (host record), qt = 'who'|'ans' (how to guess), qs = the chosen
                        questions, QB = question bank, QN = questions each.
  Scoring             : in tick() (live) and the guess handler in bind()
                        (one phone). Currently +1 per correct guess.
  Reveal time        : 3500 ms in clock() (auto-advance after a guess).

IDEAS TO EXTEND
  - Several guesses per card, or points that shrink with each wrong guess.
  - Kick/rename players, or a timer per turn.
  - Save past scores (add a "history" path in Firebase).
  - Sound or haptics on a correct guess (navigator.vibrate).
  - Lock rules down with Firebase Anonymous Auth.

TROUBLESHOOTING
  "Firebase is not set up yet"   : FBC is missing or has no apiKey.
  Stuck on "Connecting"          : wrong databaseURL, database not created,
                                   or rules not published.
  Names with . # $ [ ] /         : removed on purpose (not allowed by Firebase).
  Changes not showing after upload: wait ~1 min and reopen the tab.
=====================================================================
-->
