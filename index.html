<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who Wrote That? Party Game</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#fff3e0;--card:#fff;--ink:#2a1f4d;--mute:#7a6f96;--acc:#ff5a5f;--acc2:#6c4cf1;--sun:#ffd166;--ok:#12a36a;--bad:#e5484d;--line:#2a1f4d;--soft:#f6ead6;--shadow:#2a1f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1530;--card:#2a2146;--ink:#fff4e4;--mute:#b3a8d1;--line:#fff4e4;--soft:#362b5a;--shadow:#0d0919;--sun:#ffd166}}
:root[data-theme="dark"]{--bg:#1b1530;--card:#2a2146;--ink:#fff4e4;--mute:#b3a8d1;--line:#fff4e4;--soft:#362b5a;--shadow:#0d0919}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.35 Fredoka,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 18px 48px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px}.logo b{color:var(--acc)}
.wz{display:flex;justify-content:space-between;position:relative;margin:4px 0 20px}
.wz:before{content:"";position:absolute;left:8%;right:8%;top:15px;height:4px;background:var(--soft);border-radius:4px}
.wz div{position:relative;flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.wz b{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 4px;border-radius:50%;background:var(--soft);border:3px solid var(--line);color:var(--ink);font-size:15px}
.wz .on b{background:var(--acc);color:#fff}.wz .on{color:var(--ink)}.wz .done b{background:var(--sun);color:#2a1f4d}
.nav{display:flex;gap:10px}.nav .alt{width:96px;flex:none}
.opt small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}.code{letter-spacing:10px;font-size:52px;font-weight:700;text-align:center;color:var(--acc)}
.big{font-size:84px;font-weight:700;line-height:1;text-align:center}
.stp{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0}
.stp button{width:64px;height:64px;padding:0;font-size:32px;flex:none}
h1{font-size:34px;line-height:1.05;margin:6px 0 12px;font-weight:700}
h2{font-size:28px;line-height:1.1;margin:6px 0 12px;font-weight:700}
.how{display:flex;gap:12px;align-items:center;background:var(--sun);color:#2a1f4d;border:3px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:4px 4px 0 var(--shadow);margin:6px 0 18px;font-weight:600}
.how .n{flex:none;width:34px;height:34px;border-radius:50%;background:#2a1f4d;color:#ffd166;display:grid;place-items:center;font-weight:700}
.panel{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:5px 5px 0 var(--shadow);margin-bottom:18px}
input,textarea{width:100%;padding:14px 16px;border:3px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;margin:5px 0;outline:0}
input:focus{border-color:var(--acc2)}
button{font:inherit;font-weight:700;font-size:18px;color:#fff;background:var(--acc);border:3px solid var(--line);border-radius:16px;padding:14px 18px;width:100%;box-shadow:4px 4px 0 var(--shadow);cursor:pointer;transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
button:disabled{opacity:.45;box-shadow:none}
button.alt{background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px}.row input{flex:1;margin:0}.row button{width:auto;padding:0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:99px;padding:5px 12px 5px 5px;font-weight:600}
.chip a{color:var(--mute);cursor:pointer;padding:0 2px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;border:2px solid var(--line);flex:none}
.count{text-align:center;color:var(--mute);margin:12px 0 0;font-weight:600}
.pc{display:flex;justify-content:space-between;color:var(--mute);font-weight:600;margin:4px 2px 10px}
.ticket{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:5px 5px 0 var(--shadow);overflow:hidden;transform:rotate(-1.2deg);margin:4px 0 22px;position:relative}
.ticket .hd{background:var(--acc2);color:#fff;padding:10px 16px;font-weight:700;letter-spacing:1px;display:flex;justify-content:space-between}
.ticket .q{position:absolute;right:10px;bottom:-26px;font-size:130px;font-weight:700;opacity:.08;line-height:1}
.fact{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:20px;font-weight:600;border-top:2px dashed var(--soft)}
.fact:first-of-type{border-top:0}
.fact span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sun);color:#2a1f4d;display:grid;place-items:center;font-size:14px;font-weight:700;margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid button{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);padding:10px;font-size:17px;text-align:left}
.grid .av{width:28px;height:28px}
.res{text-align:center;border:3px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:5px 5px 0 var(--shadow);color:#fff;font-weight:700;font-size:26px}
.res small{display:block;font-size:16px;font-weight:500;opacity:.95;margin-top:2px}
.score{display:flex;align-items:center;gap:12px;padding:10px 0;font-weight:600;font-size:20px;border-bottom:2px dashed var(--soft)}
.score:last-child{border:0}.score b{margin-left:auto;font-size:24px}.score .m{width:30px;text-align:center}
</style></head><body><main id="app"></main>
<script>
var FBC=null;
(function(){try{var m=/(?:^|&)c=([^&]+)/.exec(location.hash.slice(1));if(m){FBC=JSON.parse(atob(decodeURIComponent(m[1])));try{localStorage.setItem('fbc',JSON.stringify(FBC))}catch(e){}}else{var v=localStorage.getItem('fbc');if(v)FBC=JSON.parse(v)}}catch(e){}})();
var PRE=(/(?:^|&)g=([A-Za-z0-9]{4})/.exec(location.hash.slice(1))||[])[1]||'';
var FDB=null;
function fbInit(){if(FDB)return FDB;if(typeof firebase=='undefined'||!FBC||!FBC.apiKey)return null;firebase.initializeApp(FBC);FDB=firebase.database();return FDB}
function mkRoom(code){var ref=FDB.ref('games/'+code.toLowerCase()+'/players'),pid=Math.random().toString(36).slice(2,10),mine=ref.child(pid),cache={};
ref.on('value',function(sn){cache=sn.val()||{}});
return{peers:function(){return Object.keys(cache).map(function(k){return{peer:k,kind:'viewer',isMe:k==pid,sameTab:k==pid,presence:cache[k]}})},
presence:function(patch){mine.onDisconnect().remove();return mine.update(patch)},
onPeers:function(fn){ref.on('value',function(){fn({})})},
leave:function(){ref.off();mine.remove()}}}
var C=['#ff5a5f','#6c4cf1','#12a36a','#f08c00','#1c7ed6','#d6336c','#0ca678','#7048e8','#e8590c','#364fc7'];
var S={step:'mode',mode:'',lvs:'',msg:'',min:5,players:[],facts:{},i:0,order:[],t:0,score:{},picked:null};
if(PRE&&FBC){S.mode='live';S.step='lv';S.lvs='join'}
var app=document.getElementById('app'),$=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x}return a}
function col(p){return C[S.players.indexOf(p)%10]}
function av(p){return '<span class="av" style="background:'+col(p)+'">'+esc(p.charAt(0).toUpperCase())+'</span>'}
function how(n,t){return '<div class="how"><div class="n">'+n+'</div><div>'+t+'</div></div>'}
function hdr(k){var lv=S.mode=='live',Lb=lv?['Mode','Lobby','Facts','Guess','Scores']:['Rules','Players','Facts','Guess','Scores'],m;
if(k=='lv'){var H=S.lvs=='game'&&lvH();m=H?{lobby:1,facts:2,play:3,end:4}[H.ph]:0}else m={mode:0,rules:0,setup:1,facts:2,play:3,end:4}[k];
return '<div class="top"><div class="logo">Who <b>Wrote</b> That?</div></div><div class="wz">'+Lb.map(function(l,i){return '<div class="'+(i==m?'on':i<m?'done':'')+'"><b>'+(i<m?'✓':i+1)+'</b>'+l+'</div>'}).join('')+'</div>'}
function R(){var keep={},n=0,fo=document.activeElement&&document.activeElement.id;
if(S.step=='lv')['nm','cd','cfg','f0','f1','f2'].forEach(function(i){if($(i)){keep[i]=$(i).value;n++}});
app.innerHTML=hdr(S.step)+V[S.step]();
for(var i in keep)if($(i))$(i).value=keep[i];
if(n&&fo&&$(fo))$(fo).focus();bind();if(!n)window.scrollTo(0,0)}
var V={
mode:function(){return '<h1>How do you want to play? </h1>'+how(1,'Pick one phone for everyone, or let each person use their own.')+
'<button id="m1" class="opt"> One phone<small>Pass it around the group</small></button><button id="m2" class="opt alt" style="margin-top:14px"> Everyone on their own phone<small>Live game with a 4-letter code</small></button>'},
lv:function(){var m=S.msg?'<div class="how" style="background:var(--bad);color:#fff"><div>'+esc(S.msg)+'</div></div>':'';S.msg='';
if(S.lvs=='cfg')return '<h1>One-time setup</h1>'+how(1,'Paste your Firebase web config below. Your friends will not need to.')+m+'<div class="panel"><textarea id="cfg" rows="8" placeholder="const firebaseConfig = { apiKey: ..." style="font-size:14px"></textarea></div><div class="nav"><button class="alt" id="bk">← Back</button><button id="cfgok">Save →</button></div>';
if(S.lvs=='choose')return '<h1>Play on your phones </h1>'+how(1,'One person hosts and shares a 4-letter code. Everyone else joins with it.')+m+'<div class="nav" style="flex-direction:column"><button id="hostb">Host a game</button><button class="alt" id="joinb" style="width:100%">Join a game</button><button class="alt" id="bk" style="width:100%">← Back</button></div>';
if(S.lvs=='host')return '<h1>Host a game </h1>'+how(1,'Enter your name and the minimum number of players.')+m+'<div class="panel"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off"><div class="stp"><button class="alt" id="mn">−</button><div class="big" style="font-size:56px">'+S.min+'</div><button class="alt" id="pl">+</button></div><div class="count">minimum players</div></div><div class="nav"><button class="alt" id="bk">← Back</button><button id="create">Create →</button></div>';
if(S.lvs=='join')return '<h1>Join a game </h1>'+how(1,'Type the 4-letter code from the host and your name.')+m+'<div class="panel"><input id="cd" placeholder="CODE" value="'+esc(PRE)+'" maxlength="4" autocomplete="off" style="text-transform:uppercase;text-align:center;font-size:28px;letter-spacing:8px"><input id="nm" placeholder="Your name" maxlength="20" autocomplete="off"></div><div class="nav"><button class="alt" id="bk">← Back</button><button id="joinGo">Join →</button></div>';
return m+lvGame()},
rules:function(){return '<h1>How many players at least? </h1>'+how(1,'Pick the minimum number of players needed to start (2–10).')+
'<div class="panel"><div class="stp"><button class="alt" id="mn">−</button><div class="big">'+S.min+'</div><button class="alt" id="pl">+</button></div><div class="count">minimum players · up to 10 can join</div></div>'+
'<div class="nav"><button class="alt" id="bk0">← Back</button><button id="go0">Next →</button></div>'},
setup:function(){return '<h1>Add the players </h1>'+how(2,'Type each name and tap Add. You need at least '+S.min+' (max 10).')+
'<div class="panel"><div class="row"><input id="nm" placeholder="Name" maxlength="20" autocomplete="off"><button id="add">Add</button></div>'+
'<div class="chips">'+S.players.map(function(p,i){return '<span class="chip">'+av(p)+esc(p)+' <a data-rm="'+i+'">✕</a></span>'}).join('')+'</div>'+
'<div class="count">'+S.players.length+' / 10 players'+(S.players.length<S.min?' · need '+(S.min-S.players.length)+' more':'')+'</div></div>'+
'<div class="nav"><button class="alt" id="bk">← Back</button><button id="go"'+(S.players.length<S.min?' disabled':'')+'>Next →</button></div>'},
facts:function(){var p=S.players[S.i];return '<h2>Pass the phone to <span style="color:'+col(p)+'">'+esc(p)+'</span></h2>'+how(3,'Write 2–3 true facts about <u>you</u>. Hide the screen from others!')+
'<div class="panel">'+[0,1,2].map(function(k){return '<input id="f'+k+'" placeholder="Fact '+(k+1)+(k>1?' (optional)':'')+'" maxlength="100" autocomplete="off" value="'+esc((S.facts[p]||[])[k]||'').replace(/"/g,'&quot;')+'">'}).join('')+'</div>'+
'<div class="nav"><button class="alt" id="bk">← Back</button><button id="save">'+(S.i<S.players.length-1?'Done — pass on →':'Done — start →')+'</button></div><div class="count">Player '+(S.i+1)+' of '+S.players.length+'</div>'},
play:function(){var g=S.order[S.t],o=S.order[(S.t+1)%S.order.length],h;
h='<div class="pc"><span>Card '+(S.t+1)+' of '+S.order.length+'</span><span>Your turn, '+esc(g)+'</span></div>'+
(S.picked===null?how(4,'Read the card. Tap who you think wrote it.'):how(4,'Tap Next, then pass the phone to the next player.'))+
'<div class="ticket"><div class="hd"><span>MYSTERY PLAYER</span><span>#'+(S.t+1)+'</span></div>'+S.facts[o].map(function(f,i){return '<div class="fact"><span>'+(i+1)+'</span><div>'+esc(f)+'</div></div>'}).join('')+'<div class="q">?</div></div>';
if(S.picked===null)h+='<div class="grid">'+S.players.filter(function(p){return p!==g}).map(function(p){return '<button data-g="'+esc(p)+'">'+av(p)+esc(p)+'</button>'}).join('')+'</div>';
else{var ok=S.picked===o;h+='<div class="res" style="background:var(--'+(ok?'ok':'bad')+')">'+(ok?'Correct! +1':'Not quite')+'<small>It was '+esc(o)+'</small></div><button id="next">'+(S.t<S.order.length-1?'Next player →':'See scores →')+'</button>'}
return h},
end:function(){var r=S.players.slice().sort(function(a,b){return S.score[b]-S.score[a]}),md=['','',''];
return '<h1>Final scores </h1>'+how(5,'The winner gets bragging rights. Play again or start fresh.')+
'<div class="panel">'+r.map(function(p,i){return '<div class="score"><span class="m">'+(md[i]||i+1)+'</span>'+av(p)+esc(p)+'<b>'+S.score[p]+'</b></div>'}).join('')+'</div>'+
'<button id="again">Play again</button><button class="alt" id="reset" style="margin-top:14px">New players</button>'}
};
var LV={room:null,code:'',name:'',sig:'',done:''};
function lvP(){return LV.room?LV.room.peers().filter(function(p){return p.kind=='viewer'&&p.presence.n&&!(p.isMe&&!p.sameTab)}):[]}
function lvMe(){return lvP().filter(function(p){return p.isMe})[0]}
function lvH(){var h=lvP().filter(function(p){return p.presence.h})[0];return h?h.presence:null}
function chip(n,f){return '<span class="chip">'+av(n)+esc(n)+(f===undefined?'':f?' ✓':' …')+'</span>'}
function tick(P,H){var key=H.r+'.'+H.t;if(LV.done==key)return;var gp=P.filter(function(p){return p.presence.n==H.ord[H.t]})[0],g=gp&&gp.presence.g;
if(g&&g.r===H.r&&g.t===H.t){LV.done=key;var o=H.ord[(H.t+1)%H.ord.length],sc=Object.assign({},H.sc);if(g.v===o)sc[gp.presence.n]=(sc[gp.presence.n]||0)+1;LV.room.presence({rv:1,lg:g.v,sc:sc})}}
function onP(){var P=lvP(),me=lvMe(),H=lvH();if(!me)return;
var d=P.filter(function(o){return !o.isMe&&o.presence.n==me.presence.n&&o.peer<me.peer})[0];if(d){LV.name=me.presence.n+' 2';LV.room.presence({n:LV.name});return}
if(me.presence.h&&H&&H.ph=='play'&&H.rv===0)tick(P,H);
var g=JSON.stringify([P.map(function(p){return [p.presence.n,!!p.presence.f,p.presence.g&&p.presence.g.t]}),H&&[H.ph,H.t,H.rv,H.lg,H.r]]);
if(g!==LV.sig){LV.sig=g;if(S.step=='lv'&&S.lvs=='game')R()}}
async function lvOpen(code,name,host){if(!fbInit()){S.msg='Firebase is not set up yet.';S.lvs='choose';R();return}
LV.room=mkRoom(code);LV.code=code;LV.name=name;LV.room.onPeers(onP);
await LV.room.presence(host?{n:name,h:1,ph:'lobby',min:S.min}:{n:name});S.lvs='game';R();
if(!host)setTimeout(function(){if(!lvH()){S.msg='No game found with code '+code;LV.room.leave();LV.room=null;S.lvs='join';R()}},4000)}
function lvStart(){var ord=shuffle(lvP().filter(function(p){return p.presence.f}).map(function(p){return p.presence.n})),sc={};ord.forEach(function(n){sc[n]=0});LV.room.presence({ph:'play',ord:ord,t:0,rv:0,r:Date.now(),sc:sc,lg:null})}
function lvGame(){var P=lvP(),H=lvH(),me=lvMe();
if(!H||!me)return '<h1>Connecting… </h1>'+how(1,'Hang tight, finding the game.');
var names=P.map(function(p){return p.presence.n}).sort();S.players=names;
var host=!!me.presence.h,ph=H.ph,h='';
if(ph=='lobby'){h='<h1>Game lobby </h1>'+how(2,host?'Share the code. Tap Start when everyone has joined.':'You’re in! Wait for the host to start.')+'<div class="panel"><div class="code">'+esc(LV.code)+'</div><div class="chips">'+names.map(function(n){return chip(n)}).join('')+'</div><div class="count">'+names.length+' joined'+(names.length<H.min?' · need '+(H.min-names.length)+' more':'')+'</div></div>';
if(host)h+='<button class="alt" id="sh" style="margin-bottom:14px">Share invite link</button><button id="st"'+(names.length<H.min||names.length>10?' disabled':'')+'>Start — enter facts →</button>'}
else if(ph=='facts'){var all=P.every(function(p){return p.presence.f});h='<h2>Your facts </h2>';
if(!me.presence.f)h+=how(3,'Write 2–3 true facts about <u>you</u>. Keep them secret!')+'<div class="panel">'+[0,1,2].map(function(k){return '<input id="f'+k+'" placeholder="Fact '+(k+1)+(k>1?' (optional)':'')+'" maxlength="100" autocomplete="off">'}).join('')+'</div><button id="sf">Done →</button>';
else h+=how(3,'Saved! Waiting for everyone else.')+'<div class="panel"><div class="chips">'+P.map(function(p){return chip(p.presence.n,!!p.presence.f)}).join('')+'</div></div>';
if(host&&me.presence.f)h+='<button id="sg" style="margin-top:14px"'+(all?'':' disabled')+'>Start the game →</button>'}
else if(ph=='play'){var n=H.ord.length,g=H.ord[H.t],o=H.ord[(H.t+1)%n],op=P.filter(function(p){return p.presence.n==o})[0],f=(op&&op.presence.f)||['(player left)'],mine=g==me.presence.n,locked=me.presence.g&&me.presence.g.r===H.r&&me.presence.g.t===H.t;
h='<div class="pc"><span>Card '+(H.t+1)+' of '+n+'</span><span>'+(mine?'Your turn!':esc(g)+'’s turn')+'</span></div>'+how(4,H.rv?(host?'Tap Next to continue.':'Wait for the host to continue.'):mine?'Tap who you think wrote this card.':'Guess in your head — '+esc(g)+' is choosing.')+
'<div class="ticket"><div class="hd"><span>MYSTERY PLAYER</span><span>#'+(H.t+1)+'</span></div>'+f.map(function(x,i){return '<div class="fact"><span>'+(i+1)+'</span><div>'+esc(x)+'</div></div>'}).join('')+'<div class="q">?</div></div>';
if(!H.rv){if(mine&&!locked)h+='<div class="grid">'+H.ord.filter(function(x){return x!==g}).map(function(x){return '<button data-lg="'+esc(x)+'">'+av(x)+esc(x)+'</button>'}).join('')+'</div>';else if(locked)h+='<div class="count">Locked in ✓</div>'}
else{var ok=H.lg===o;h+='<div class="res" style="background:var(--'+(ok?'ok':'bad')+')">'+(ok?''+esc(g)+' got it! +1':'Not quite')+'<small>It was '+esc(o)+'</small></div>'+(host?'<button id="nx">'+(H.t<n-1?'Next →':'See scores →')+'</button>':'')}}
else{var r=H.ord.slice().sort(function(a,b){return H.sc[b]-H.sc[a]}),md=['','',''];h='<h1>Final scores </h1>'+how(5,host?'Play again with a new order, or finish.':'The host can start another round.')+'<div class="panel">'+r.map(function(x,i){return '<div class="score"><span class="m">'+(md[i]||i+1)+'</span>'+av(x)+esc(x)+'<b>'+H.sc[x]+'</b></div>'}).join('')+'</div>'+(host?'<button id="ag">Play again</button>':'')}
return h}
function bind(){
