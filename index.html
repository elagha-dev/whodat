<!DOCTYPE html>
<!--
=====================================================================
 WHO DAT  -  Developer notes (for later use / extension)
=====================================================================

WHAT IT IS
  A party game for 2-10 players. Everyone writes 2-3 secret facts, then
  each turn one player sees another player's facts and guesses who wrote
  them. Single file (index.html), no build step. Works in two modes:
    1. One phone  : pass the phone around. No internet needed.
    2. Live       : every player on their own phone, synced by Firebase.

HOSTING
  Upload index.html to a public GitHub repo, then Settings > Pages >
  Branch: main > Save. Any static host works (Netlify, Firebase Hosting).

FIREBASE SETUP (one time)
  1. console.firebase.google.com > create project > add Web app (</>).
  2. Menu > Databases & Storage > Realtime Database > Create Database
     (location: United States) > Rules tab > paste:
       { "rules": { "games": { "$code": { ".read": true, ".write": true } } } }
     > Publish.
  3. Put your config in the FBC variable at the top of the <script>.
     If you use another database region, set databaseURL to the address
     shown at the top of the Realtime Database page.
  The config is not secret. The rules above let anyone read/write the
  "games" data; tighten them if you ever store anything sensitive.

HOW LIVE MODE WORKS
  Data lives at  games/<CODE>/players/<playerId>  (one record per phone).
  Each phone writes only its own record ("presence"):
    Everyone : n = name, f = facts [..], g = guess {t, r, v}
    Host only: h = 1, ph = phase (lobby|facts|play|end), min, ord = turn
               order, t = turn index, rv = 1 when result is shown,
               lg = last guess, sc = scores {name: points}, r = round id,
               end = lobby countdown end (server time, ms)
  The HOST phone is the referee. All phones just render what they see.
  Card for turn t: guesser = ord[t], facts owner = ord[(t+1) % n]
  (a rotation, so nobody ever gets their own card).
  Disconnected phones are removed automatically (onDisconnect).
  The invite link carries the Firebase config and game code in the URL
  hash (#c=...&g=CODE), so friends need no setup.

MAIN PARTS OF THE CODE  (search for these names)
  FBC, fbInit, mkRoom : Firebase connection and the small "room" wrapper
  V.mode / V.rules / V.setup / V.facts / V.play / V.end : one-phone screens
  V.lv, lvGame        : live-mode screens (lobby, facts, play, end)
  lvOpen, onP, tick   : join/create game, react to changes, host scoring
  lvStart             : host starts or restarts a game (shuffles order)
  hdr                 : the 5-step wizard bar at the top
  CSS variables in :root : colors and dark mode

EASY CHANGES
  Colors / fonts      : edit the :root variables and the Fredoka font link.
  Player limits       : minimum is chosen in the app; max 10 is checked in
                        lvGame (names.length>10) and setup (players.length>=10).
  Facts per player    : the three inputs f0,f1,f2 (min 2 checked in 'sf'
                        and 'save'); add f3 by extending those arrays.
  Scoring             : in tick() (live) and the guess handler in bind()
                        (one phone). Currently +1 per correct guess.
  Wizard labels       : the Lb array in hdr().

IDEAS TO EXTEND
  - Several guesses per card, or points that shrink with each wrong guess.
  - Kick/rename players, or a timer per turn.
  - Save past scores (add a "history" path in Firebase).
  - Sound or haptics on a correct guess (navigator.vibrate).
  - Lock rules down with Firebase Anonymous Auth.

TROUBLESHOOTING
  "Firebase is not set up yet"   : FBC is missing or has no apiKey.
  Stuck on "Connecting"          : wrong databaseURL, database not created,
                                   or rules not published.
  Names with . # $ [ ] /         : removed on purpose (not allowed by Firebase).
  Changes not showing after upload: wait ~1 min and reopen the tab.
=====================================================================
-->

var g=JSON.stringify([P.map(function(p){return [p.presence.n,!!p.presence.f,p.presence.g&&p.presence.g.t]}),H&&[H.ph,H.t,H.rv,H.lg,H.r]]);
if(g!==LV.sig){LV.sig=g;if(S.step=='lv'&&S.lvs=='game')R()}}
var OFF=0;function now(){return Date.now()+OFF}
function clkTxt(H,n){var r=Math.max(0,Math.ceil((H.end-now())/1000));if(r>0)return 'Starts in '+Math.floor(r/60)+':'+('0'+r%60).slice(-2);return n>=H.min?'Starting…':'Waiting for '+(H.min-n)+' more players'}
function clock(){var H=lvH();if(!H||H.ph!='lobby')return;var P=lvP(),me=lvMe(),c=$('clk');if(c)c.textContent=clkTxt(H,P.length);

async function lvOpen(code,name,host){if(!fbInit()){S.msg='Firebase is not set up yet.';S.step='mode';S.mode='';R();return}

if(!host)setTimeout(function(){if(!lvH()){S.msg='No game found with code '+code;LV.room.leave();LV.room=null;S.lvs='join';R()}},4000)}
function lvStart(){var ord=shuffle(lvP().filter(function(p){return p.presence.f}).map(function(p){return p.presence.n})),sc={};ord.forEach(function(n){sc[n]=0});LV.room.presence({ph:'play',ord:ord,t:0,rv:0,r:Date.now(),sc:sc,lg:null})}
function lvGame(){var P=lvP(),H=lvH(),me=lvMe();
if(!H||!me)return how(1,'Connecting… finding the game.');
var names=P.map(function(p){return p.presence.n}).sort();S.players=names;
var host=!!me.presence.h,ph=H.ph,h='';
if(ph=='lobby'){h=how(2,host?'Share the invite link. The game starts automatically when the countdown ends.':'You are in! The game starts automatically when the countdown ends.')+'<div class="panel"><div class="count" style="margin:0">Game code</div><div class="code">'+esc(LV.code)+'</div><div class="res no" style="font-size:22px;padding:12px;margin:10px 0" id="clk">'+clkTxt(H,names.length)+'</div><div class="chips">'+names.map(function(n){return chip(n)}).join('')+'</div><div class="count">'+names.length+' joined'+(names.length<H.min?' · need '+(H.min-names.length)+' more':'')+'</div></div>';
if(host)h+='<button class="alt" id="sh" style="margin-bottom:14px">Share invite link</button><div class="nav"><button class="alt" id="ad">+1 min</button><button id="st"'+(names.length<H.min?' disabled':'')+'>Start now →</button></div>'}
else if(ph=='facts'){var all=P.every(function(p){return p.presence.f});h='';
if(!me.presence.f)h+=how(3,'Write 2–3 true facts about <u>you</u>. Keep them secret!')+'<div class="panel">'+[0,1,2].map(function(k){return '<input id="f'+k+'" placeholder="Fact '+(k+1)+(k>1?' (optional)':'')+'" maxlength="100" autocomplete="off">'}).join('')+'</div><button id="sf">Done →</button>';
else h+=how(3,'Saved! The game starts automatically when everyone is done.')+'<div class="panel"><div class="chips">'+P.map(function(p){return chip(p.presence.n,!!p.presence.f)}).join('')+'</div></div>';
}
else if(ph=='play'){var n=H.ord.length,g=H.ord[H.t],o=H.ord[(H.t+1)%n],op=P.filter(function(p){return p.presence.n==o})[0],f=(op&&op.presence.f)||['(player left)'],mine=g==me.presence.n,locked=me.presence.g&&me.presence.g.r===H.r&&me.presence.g.t===H.t;
h='<div class="pc"><span>Card '+(H.t+1)+' of '+n+'</span><span>'+(mine?'Your turn!':esc(g)+'’s turn')+'</span></div>'+how(4,H.rv?(host?'Tap Next to continue.':'Wait for the host to continue.'):mine?'Tap who you think wrote this card.':'Guess in your head — '+esc(g)+' is choosing.')+
'<div class="ticket"><div class="hd"><span>MYSTERY PLAYER</span><span>#'+(H.t+1)+'</span></div>'+f.map(function(x,i){return '<div class="fact"><span>'+(i+1)+'</span><div>'+esc(x)+'</div></div>'}).join('')+'<div class="q">?</div></div>';
if(!H.rv){if(mine&&!locked)h+='<div class="grid">'+H.ord.filter(function(x){return x!==g}).map(function(x){return '<button data-lg="'+esc(x)+'">'+av(x)+esc(x)+'</button>'}).join('')+'</div>';else if(locked)h+='<div class="count">Locked in ✓</div>'}
else{var ok=H.lg===o;h+='<div class="res '+(ok?'ok':'no')+'">'+(ok?''+esc(g)+' got it! +1':'Not quite')+'<small>It was '+esc(o)+'</small></div>'+(host?'<button id="nx">'+(H.t<n-1?'Next →':'See scores →')+'</button>':'')}}
else{var r=H.ord.slice().sort(function(a,b){return H.sc[b]-H.sc[a]}),md=['','',''];h=how(5,host?'Final scores. Play again with a new order, or finish.':'Final scores. The host can start another round.')+'<div class="panel">'+r.map(function(x,i){return '<div class="score"><span class="m">'+(md[i]||i+1)+'</span>'+av(x)+esc(x)+'<b>'+H.sc[x]+'</b></div>'}).join('')+'</div>'+(host?'<button id="ag">Play again</button>':'')}

function help(){var d=document.createElement('div');d.className='ov';
d.innerHTML='<div class="sheet"><h2>How to play</h2><ol><li>Everyone secretly writes 2–3 true facts about themselves.</li><li>The facts are shuffled into mystery cards. Nobody gets their own card.</li><li>On your turn, read the card and tap the person you think wrote it.</li><li>A correct guess scores 1 point. The most points at the end wins.</li></ol><h3>One phone</h3><p>Pass the same phone around. Hide the screen while writing your facts.</p><h3>Everyone on their own phone</h3><ul><li>The host creates a game and sends the invite link.</li><li>Friends open the link, add their own name and join. They appear in the lobby.</li><li>The game starts automatically when the countdown ends and enough players have joined.</li><li>Facts are collected, then the guessing starts by itself.</li><li>Late joiners can only watch.</li></ul><h3>Tips</h3><ul><li>Pick facts that are surprising but not too obvious.</li><li>Do not react when your own card shows up.</li></ul><button id="hx" style="margin-top:6px">Got it</button></div>';
